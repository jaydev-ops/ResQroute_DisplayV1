<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="800" fill="#000000" rx="40" />

  <!-- Outer Disaster Threat Ring -->
  <g stroke="#FFFFFF" fill="none">
    <!-- Outer perimeter circle -->
    <circle cx="400" cy="360" r="230" stroke-width="8" />

    <!-- Ring divider marks -->
    <line x1="400" y1="130" x2="400" y2="180" stroke-width="5" />
    <line x1="170" y1="360" x2="220" y2="360" stroke-width="5" />
    <line x1="580" y1="360" x2="630" y2="360" stroke-width="5" />
  </g>

  <!-- Hazard Sector 1: Storm & Lightning (Top-Left) -->
  <g transform="translate(240, 160)" fill="#FFFFFF">
    <!-- Cloud -->
    <path d="M45,35 Q30,35 25,48 Q10,50 12,65 Q12,78 28,78 L85,78 Q100,78 100,64 Q100,52 88,50 Q88,35 70,35 Q60,35 55,40 Q52,35 45,35 Z" />
    <!-- Rain drops -->
    <line x1="25" y1="88" x2="20" y2="102" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="88" x2="37" y2="102" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="88" x2="55" y2="102" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <!-- Lightning Bolt -->
    <polygon points="75,80 58,105 70,105 52,135 88,98 72,98" fill="#FFFFFF" />
  </g>

  <!-- Hazard Sector 2: Tsunami & Flood Waves (Bottom-Left) -->
  <g transform="translate(195, 305)" fill="#FFFFFF">
    <!-- Wave 1 (Large breaking curl) -->
    <path d="M15,90 C30,70 55,50 85,55 C95,57 105,65 100,75 C95,85 80,82 75,75 C65,65 50,68 40,80 C32,90 25,98 15,90 Z" />
    <path d="M10,120 C35,95 70,85 105,95 C115,98 120,108 112,118 C105,125 92,122 88,115 C78,105 58,105 45,118 L10,120 Z" />
    <!-- Wave foam dots -->
    <circle cx="95" cy="50" r="4" />
    <circle cx="108" cy="62" r="3" />
    <circle cx="118" cy="85" r="4" />
    <circle cx="30" cy="60" r="3.5" />
  </g>

  <!-- Hazard Sector 3: Wind & Debris (Top-Right) -->
  <g transform="translate(480, 160)" fill="#FFFFFF">
    <!-- Wind swirl streamlines -->
    <path d="M10,40 C35,28 75,25 95,45 C105,55 100,68 88,68 C76,68 75,55 85,48" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M30,65 C55,55 85,55 105,72 C112,78 110,88 100,88" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Debris flying -->
    <polygon points="40,25 48,22 45,30 38,28" />
    <polygon points="75,18 82,14 80,22" />
    <circle cx="118" cy="55" r="5" />
    <circle cx="132" cy="70" r="4" />
    <circle cx="145" cy="88" r="6" />
  </g>

  <!-- Hazard Sector 4: Earthquake & Collapsing Building (Bottom-Right) -->
  <g transform="translate(490, 275)" fill="#FFFFFF">
    <!-- Collapsing / tilting urban building -->
    <g transform="rotate(14 60 70)">
      <path d="M40,20 L80,20 L80,100 L40,100 Z" fill="#FFFFFF" />
      <!-- Window cutouts in black -->
      <rect x="46" y="28" width="8" height="10" rx="1" fill="#000000" />
      <rect x="62" y="28" width="8" height="10" rx="1" fill="#000000" />
      <rect x="46" y="46" width="8" height="10" rx="1" fill="#000000" />
      <rect x="62" y="46" width="8" height="10" rx="1" fill="#000000" />
      <rect x="46" y="64" width="8" height="10" rx="1" fill="#000000" />
      <rect x="62" y="64" width="8" height="10" rx="1" fill="#000000" />
    </g>
    <!-- Earthquake ground fissures -->
    <path d="M25,125 L45,105 L60,118 L80,95 L100,112 L120,85 L135,100" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M35,138 L55,122 L72,132 L95,115 L115,128" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Central Map Pin (Location Marker) -->
  <g id="central-pin">
    <!-- Pin outer path with bottom-right pointing tail -->
    <path d="M400,165 C285,165 195,255 195,370 C195,445 235,510 295,548 L400,645 L460,535 C565,505 605,420 605,370 C605,255 515,165 400,165 Z" fill="#FFFFFF" />

    <!-- Dark interior cutout of Pin Head -->
    <path d="M400,195 C305,195 228,272 228,367 C228,425 258,477 305,508 L400,600 L445,502 C515,480 572,430 572,367 C572,272 495,195 400,195 Z" fill="#000000" />

    <!-- The Winding Perspective Evacuation Road -->
    <path d="M295,510 C320,470 380,455 350,405 C335,380 355,355 385,350 L415,350 C445,355 465,380 450,405 C420,455 480,470 505,510 Z" fill="#FFFFFF" />
    <!-- Road surface inner contrast -->
    <path d="M305,512 C330,473 388,458 358,408 C345,385 363,362 390,358 L410,358 C437,362 455,385 442,408 C412,458 470,473 495,512 Z" fill="#000000" />

    <!-- Dashed Road Lane Markings -->
    <path d="M400,370 L400,385" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M396,400 C392,415 390,425 388,435" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <path d="M386,450 C384,465 382,475 378,488" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Safe Shelter / House Structure -->
    <g transform="translate(400, 310)" fill="#FFFFFF">
      <!-- Triangular Gable Roof -->
      <polygon points="0,-38 -45,-3 45,-3" />
      <polygon points="0,-48 -54,-6 -46,-1 0,-40 46,-1 54,-6" />
      <!-- Chimney / Antenna -->
      <rect x="22" y="-34" width="7" height="16" />

      <!-- Shelter Body / Walls -->
      <path d="M-38, -3 L-38,36 L38,36 L38,-3 Z" />

      <!-- Open Doorway / Haven Arch -->
      <path d="M-22,36 L-22,12 C-22,0 22,0 22,12 L22,36 Z" fill="#000000" />

      <!-- 3 Silhouetted People Inside Doorway (Family in Shelter) -->
      <!-- Left Person (Adult) -->
      <circle cx="-11" cy="14" r="3.5" fill="#FFFFFF" />
      <path d="M-16,34 C-16,23 -6,23 -6,34 Z" fill="#FFFFFF" />

      <!-- Center Person (Child / Shorter) -->
      <circle cx="0" cy="18" r="3" fill="#FFFFFF" />
      <path d="M-5,34 C-5,26 5,26 5,34 Z" fill="#FFFFFF" />

      <!-- Right Person (Adult) -->
      <circle cx="11" cy="14" r="3.5" fill="#FFFFFF" />
      <path d="M6,34 C6,23 16,23 16,34 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: ResQroute -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="730" font-size="80" font-weight="900" letter-spacing="-1">
      Res<tspan fill="#FFFFFF">Q</tspan>route
    </text>
  </g>
</svg>
